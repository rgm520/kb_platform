<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业知识平台</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/v2.css">
</head>
<body>
<div id="app">
  <!-- 登录 -->
  <div id="login" class="login-wrap hidden">
    <div class="login-left">
      <div class="login-brand">
        <div class="logo-mark">KB</div>
        <h1>企业知识平台 <span>2.0</span></h1>
        <p>把文件、知识与人连在一起的企业 NAS。</p>
        <ul class="login-points">
          <li>账号登录，按目录授权</li>
          <li>文件名秒搜，内容智能问答</li>
          <li>本地共享与 SMB 存储统一接入</li>
        </ul>
      </div>
      <div class="login-grid" aria-hidden="true"></div>
      <div class="login-glow" aria-hidden="true"></div>
    </div>
    <div class="login-right">
      <form id="login-form" class="card login-card">
        <h2>登录工作台</h2>
        <p class="muted">使用管理员分配的账号进入</p>
        <label>用户名<input id="login-user" autocomplete="username" required></label>
        <label>密码<input id="login-pass" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="primary">进入平台</button>
        <div id="login-err" class="err"></div>
      </form>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="main" class="hidden">
    <header class="topbar">
      <div class="brand">企业知识平台</div>
      <button id="btn-home" class="ghost home-btn" title="返回主菜单">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 11.2L12 4l8.5 7.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 10.4V20h12v-9.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>主菜单</span>
      </button>
      <div class="right">
        <span id="who" class="muted"></span>
        <button id="btn-chpwd" class="ghost">修改密码</button>
        <button id="logout" class="ghost">退出</button>
      </div>
    </header>

    <!-- 功能桌面 -->
    <section id="p-desktop" class="page desk-page">
      <div class="desk-search">
        <svg class="desk-search-ico" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <path d="M16.5 16.5L21 21" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <input id="desk-q" type="search" placeholder="搜索文件、知识与文档" autocomplete="off" spellcheck="false">
        <div id="desk-results" class="desk-results hidden"></div>
      </div>

      <div id="desktop-grid" class="desktop-grid">
        <button class="desk-card" data-open="files" title="浏览、搜索、预览与上传">
          <span class="desk-icon">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <defs><linearGradient id="g-folder" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs>
              <path d="M5 15a4 4 0 0 1 4-4h8.5l4.5 5.5H39a4 4 0 0 1 4 4V37a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z" fill="#d97706" opacity=".55"/>
              <path d="M5 21h38v16a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z" fill="url(#g-folder)"/>
              <path d="M9 25h30M9 30h20" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="desk-label">文件</span>
        </button>

        <button class="desk-card" data-open="ask" title="按文件名或内容找答案">
          <span class="desk-icon">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <defs><linearGradient id="g-ask" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#38e8f0"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
              <path d="M7 13a5 5 0 0 1 5-5h24a5 5 0 0 1 5 5v14a5 5 0 0 1-5 5H21l-9.5 8.5V32H12a5 5 0 0 1-5-5z" fill="url(#g-ask)"/>
              <path d="M24 12.5l2.3 5.6 5.6 2.3-5.6 2.3L24 28.3l-2.3-5.6-5.6-2.3 5.6-2.3z" fill="#06121f" opacity=".9"/>
            </svg>
          </span>
          <span class="desk-label">AI 问答</span>
        </button>

        <button class="desk-card" data-open="graph" title="查看实体与知识点关联">
          <span class="desk-icon">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <defs><linearGradient id="g-graph" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
              <g stroke="url(#g-graph)" stroke-width="2.2" fill="none" opacity=".75">
                <path d="M12 14l12 9 12-9M24 23v11M12 14v13l12 7 12-7V14M24 23L12 27M24 23l12 4"/>
              </g>
              <g fill="url(#g-graph)">
                <circle cx="12" cy="14" r="5"/><circle cx="36" cy="14" r="5"/>
                <circle cx="24" cy="23" r="5.5"/><circle cx="12" cy="27" r="4"/>
                <circle cx="36" cy="27" r="4"/><circle cx="24" cy="36" r="4"/>
              </g>
            </svg>
          </span>
          <span class="desk-label">知识图谱</span>
        </button>

        <button class="desk-card" data-open="board" title="解析进度与文档状态">
          <span class="desk-icon">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <defs><linearGradient id="g-board" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#059669"/></linearGradient></defs>
              <rect x="9" y="9" width="30" height="34" rx="5" fill="url(#g-board)"/>
              <rect x="18" y="4" width="12" height="8" rx="3" fill="#065f46"/>
              <g stroke="#052e27" stroke-width="2.6" stroke-linecap="round">
                <path d="M15 22h18M15 28h18M15 34h11"/>
              </g>
            </svg>
          </span>
          <span class="desk-label">文档看板</span>
        </button>

        <button class="desk-card" data-open="admin" title="密钥、智能体与审计">
          <span class="desk-icon">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <defs><linearGradient id="g-admin" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs>
              <rect x="7" y="9" width="34" height="30" rx="6" fill="url(#g-admin)"/>
              <g stroke="#04152e" stroke-width="3" stroke-linecap="round" opacity=".85">
                <path d="M13 18h22M13 30h22"/>
              </g>
              <g fill="#e0f2fe" stroke="#04152e" stroke-width="2.2">
                <circle cx="20" cy="18" r="4.6"/><circle cx="30" cy="30" r="4.6"/>
              </g>
            </svg>
          </span>
          <span class="desk-label">管理台</span>
        </button>

        <button class="desk-card" data-open="trash" title="恢复误删的文件">
          <span class="desk-icon">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <defs><linearGradient id="g-trash" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient></defs>
              <rect x="8" y="10" width="32" height="6" rx="3" fill="#9f1239"/>
              <rect x="18" y="5" width="12" height="6" rx="3" fill="#9f1239"/>
              <path d="M12 18h24l-2 23a4.5 4.5 0 0 1-4.5 4.2h-11A4.5 4.5 0 0 1 14 41z" fill="url(#g-trash)"/>
              <g stroke="#fff1f2" stroke-width="2.4" stroke-linecap="round" opacity=".85">
                <path d="M20 25v13M28 25v13"/>
              </g>
            </svg>
          </span>
          <span class="desk-label">回收站</span>
        </button>
      </div>
    </section>

    <!-- 文件管理器 -->
    <section id="p-files" class="page">
      <div class="fm-shell">
        <aside class="fm-side">
          <div class="fm-side-head">存储源</div>
          <div id="fm-sources"></div>
        </aside>
        <div class="fm-main">
          <div class="fm-toolbar">
            <div id="fm-crumbs" class="fm-crumbs"></div>
            <div class="fm-actions">
              <input id="fm-search" placeholder="按文件名秒搜…" autocomplete="off">
              <label class="fm-csearch" title="同时搜索文件正文（记不住文件名时按内容找）">
                <input type="checkbox" id="fm-content-search">搜正文</label>
              <select id="fm-sort" title="排序方式">
                <option value="mtime">修改时间</option>
                <option value="name">名称</option>
                <option value="ext">类型</option>
                <option value="size">大小</option>
              </select>
              <button id="fm-sort-dir" class="fm-sortdir" title="升序 / 降序">↓ 降序</button>
              <select id="fm-group" title="分组（列表视图可用）">
                <option value="none">不分组</option>
                <option value="name">按名称</option>
                <option value="ext">按类型</option>
                <option value="size">按大小</option>
                <option value="mtime">按修改时间</option>
              </select>
              <span class="fm-view">
                <button id="fm-view-icons" title="大图标">▦</button>
                <button id="fm-view-list" title="详细信息">☰</button>
              </span>
              <button id="fm-upload" class="primary">上传</button>
              <input id="fm-file" type="file" multiple hidden>
            </div>
          </div>
          <div id="fm-search-results" class="fm-search-results hidden"></div>
          <div id="fm-content-results" class="fm-search-results hidden"></div>
          <div id="fm-table-wrap" class="fm-table-wrap">
            <table class="fm-table">
              <thead><tr>
                <th class="fm-check"><input type="checkbox" id="fm-check-all"></th>
                <th data-sort="name">名称<span class="ar"></span></th>
                <th data-sort="size">大小<span class="ar"></span></th>
                <th data-sort="ext">类型<span class="ar"></span></th>
                <th data-sort="mtime">修改时间<span class="ar"></span></th>
                <th>解析状态</th>
              </tr></thead>
              <tbody id="fm-list"></tbody>
            </table>
          </div>
          <div id="fm-icons" class="fm-icons hidden"></div>
          <div id="fm-upload-panel" class="fm-upload-panel hidden"></div>
        </div>
        <aside id="fm-preview" class="fm-preview hidden"></aside>
      </div>
      <div id="fm-ctx" class="fm-ctx hidden"></div>
    </section>

    <!-- 回收站 -->
    <section id="p-trash" class="page">
      <div class="page-head">
        <div><h2>回收站</h2><p class="muted">删除的文件可在这里恢复，过期后由管理员清理。</p></div>
        <button id="trash-refresh">刷新</button>
      </div>
      <div id="trash-list"></div>
    </section>

    <!-- 看板 -->
    <section id="p-board" class="page">
      <div id="doc-ctx" class="fm-ctx hidden"></div>
      <div id="stat-cards" class="cards"></div>
      <div class="status-tabs" id="status-tabs">
        <button class="tab active" data-status="">全部<b id="tab-all">0</b></button>
        <button class="tab" data-status="done">已解析<b id="tab-done">0</b></button>
        <button class="tab" data-status="pending">待处理<b id="tab-pending">0</b></button>
        <button class="tab" data-status="failed">失败<b id="tab-failed">0</b></button>
        <button class="tab" data-status="skipped">已跳过<b id="tab-skipped">0</b></button>
      </div>
      <div id="board-ocr" class="src-hint hidden" style="margin:0 0 12px"></div>
      <div class="toolbar" id="board-toolbar">
        <input id="f-share" placeholder="按共享筛选（模糊）">
        <select id="pg-size">
          <option value="20">20 条/页</option>
          <option value="50" selected>50 条/页</option>
          <option value="100">100 条/页</option>
        </select>
        <button id="btn-refresh">刷新</button>
        <span id="doc-total" class="muted"></span>
      </div>
      <div class="table-wrap" id="doc-table-wrap">
        <table id="doc-table">
          <colgroup>
            <col class="c-file"><col class="c-share"><col class="c-type">
            <col class="c-status"><col class="c-progress"><col class="c-chunk">
            <col class="c-kp"><col class="c-time"><col class="c-act">
          </colgroup>
          <thead><tr><th>文件</th><th>共享</th><th>类型</th><th>状态</th><th>两层进度</th><th>块</th><th>知识点</th><th>更新时间</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="doc-stats" class="hidden"></div>
      <div class="pager" id="doc-pager">
        <button id="pg-first">首页</button>
        <button id="pg-prev">上一页</button>
        <span id="pg-info"></span>
        <button id="pg-next">下一页</button>
        <button id="pg-last">末页</button>
      </div>
    </section>

    <!-- 图谱 -->
    <section id="p-graph" class="page">
      <div class="toolbar">
        <input id="g-q" placeholder="搜索实体 / 知识点名称">
        <button id="g-search">搜索节点</button>
        <button id="g-refresh">刷新图谱</button>
        <span class="fm-view">
          <button id="g-zoom-out" title="缩小">−</button>
          <button id="g-zoom-in" title="放大">＋</button>
        </span>
        <button id="g-fit" title="把全部节点缩放到可视范围">适应窗口</button>
        <button id="g-layout" title="按当前窗口大小重新排布节点">重新布局</button>
        <label class="chk"><input type="checkbox" id="g-entity" checked>实体</label>
        <label class="chk"><input type="checkbox" id="g-kp" checked>知识点</label>
        <label class="chk"><input type="checkbox" id="g-cat" checked>分类</label>
        <label class="chk"><input type="checkbox" id="g-rel-label">关系文字</label>
        <span class="muted">点击节点展开邻居</span>
      </div>
      <div class="graph-wrap">
        <div id="cy"></div>
        <aside id="g-side"><p class="muted">选择左侧节点查看详情</p></aside>
      </div>
      <div id="g-list" class="g-list"></div>
    </section>

    <!-- 问答 -->
    <section id="p-ask" class="page">
      <div id="cite-ctx" class="fm-ctx hidden"></div>
      <div class="ask-wrap">
        <div class="ask-bar">
          <select id="a-model"></select>
          <input id="a-q" placeholder="例如：三级及以下子企业能不能自建数据机房？">
          <button id="a-go" class="primary">提问</button>
        </div>
        <div id="a-notice" class="notice hidden"></div>
        <div id="a-answer" class="answer"></div>
        <div id="a-feedback" class="ask-feedback hidden"></div>
        <div id="a-cites" class="cites"></div>
        <div class="ask-samples">
          <span class="muted">试试：</span>
          <a href="#" data-q="核心业务信息化具体包括哪些业务领域？">核心业务信息化包括哪些业务领域</a>
          <a href="#" data-q="哪些系统不得单独建设，须统一使用？">哪些系统不得单独建设</a>
          <a href="#" data-q="软件正版化率要求是多少？">软件正版化率要求</a>
          <a href="#" data-q="信息化项目全生命周期包含哪些阶段？">项目全生命周期</a>
        </div>
      </div>
    </section>

    <!-- 管理台 -->
    <section id="p-admin" class="page">
      <div class="tabs">
        <button data-t="tokens">API 密钥</button>
        <button data-t="agents">已接入智能体</button>
        <button data-t="audit">调用审计</button>
        <button data-t="users" class="admin-only">用户与权限</button>
        <button data-t="sources" class="admin-only">存储接入</button>
        <button data-t="models" class="admin-only">模型配置</button>
        <button data-t="restricted" class="admin-only">涉密目录</button>
        <button data-t="traces" class="admin-only">检索轨迹</button>
      </div>
      <div id="admin-body" class="admin-body"></div>
    </section>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="modal-card"><div id="modal-body"></div>
  <div class="modal-foot"><button id="modal-close">关闭</button></div></div></div>

<div id="toast" class="toast hidden"></div>

<script src="/static/vendor/cytoscape.min.js"></script>
<script src="/static/desktop.js"></script>
<script src="/static/files.js"></script>
<script src="/static/admin-sources.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
